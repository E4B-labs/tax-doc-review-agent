[project]
name = "tax-doc-review-agent"
version = "0.1.0"
description = "A durable, human-reviewed tax document posting agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Kacper" }]
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "langchain-anthropic==1.5.6",
  "langgraph==1.2.11",
  "langgraph-checkpoint-redis==0.5.1",
  "mcp==2.0.0",
  "pydantic==2.13.4",
  # redisvl (required by RedisSaver 0.5.1) currently caps redis below 8.
  "redis==7.4.1",
  "uvicorn[standard]==0.52.3",
]

[project.optional-dependencies]
observability = ["langfuse==4.14.4"]

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.3",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "mcp_server"]
